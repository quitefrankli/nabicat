[project]
name = "nabicat"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Bootstrap-Flask==2.4.2",
    "boto3==1.37.30",
    "botocore==1.37.30",
    "click==8.1.8",
    "concurrent-log-handler==0.9.29",
    "Flask==3.1.3",
    "Flask-Limiter==3.12",
    "Flask-Login==0.6.3",
    "gunicorn==23.0.0",
    "markdown-it-py==3.0.0",
    "MarkupSafe==3.0.2",
    "packaging==24.2",
    "pandas==2.2.3",
    "plotly==6.0.1",
    "pydantic==2.11.3",
    "scipy==1.15.2",
    "Werkzeug>=3.1.9",
    "Flask-WTF>=1.2.0",
    "gitpython>=3.2.1",
    "yt-dlp[default]>=2026.10.21",
    "keyring==25.7.0",
    "pydub>=0.25.1",
    "requests>=2.32.5",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "playwright>=1.50.0",
    "playwright-stealth>=1.0.6",
    "cryptography>=44.0.0",
    "beautifulsoup4>=4.12.0",
    "audioop-lts>=0.2.2; python_version >= \"3.13\"",
    "pillow>=13.0.0",
    "pillow-heif>=0.18.0",
    "pypdf>=6.21.2,<7",
]

[project.scripts]
server = "web_app.__main__:cli_start"
api-helper = "scripts.api_helper:cli"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest",
    "tomlkit>=0.13.3",
    "fakeredis>=2.37.0",
    "pytest-playwright>=0.7.0",
]

[tool.uv]
python-preference = "only-managed"

[tool.setuptools.packages.find]
where = ["."]
include = ["web_app*", "scripts*"]
namespaces = true
