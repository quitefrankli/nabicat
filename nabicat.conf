limit_req_zone $binary_remote_addr zone=ratelimit:10m rate=5r/s;

server {
	listen 80;
	server_name nabicat.site;
	client_max_body_size 11G;
	if ($http_user_agent ~* (scrapy|scanner) ) {
    	return 403;
	}
	if ($http_user_agent = "") {
    	return 403;
	}

	return 301 https://$host$request_uri; # Redirect to HTTPS

	# location / {
	# 	proxy_pass http://127.0.0.1:5000;
	# 	proxy_set_header Host $host;
	# 	proxy_set_header X-Real-IP $remote_addr;
	# 	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	# 	limit_req zone=ratelimit burst=10 nodelay;
	# }
}

server {
	listen 443 ssl;
	server_name nabicat.site;
	ssl_certificate /etc/letsencrypt/live/nabicat.site/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/nabicat.site/privkey.pem;
	client_max_body_size 11G;
	client_body_timeout 300s;
	if ($http_user_agent ~* (scrapy|scanner) ) {
    	return 403;
	}
	if ($http_user_agent = "") {
    	return 403;
	}
	location = /jhunt-ui/api/events {
		proxy_pass http://127.0.0.1:5000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 45s;
		proxy_send_timeout 45s;
	}
	location / {
		proxy_pass http://127.0.0.1:5000;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_connect_timeout 720;
		proxy_send_timeout 720;
		proxy_read_timeout 720;
		limit_req zone=ratelimit burst=10 nodelay;
	}
}
