name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    if: ${{ !startsWith(github.ref, 'refs/tags/deploy-now/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-server

      - name: Run tests
        run: |
          SLOW_TEST_COUNT=$(uv run --locked python -c 'from web_app.config import ConfigManager; print(ConfigManager().ci_slow_test_count)')
          uv run --locked pytest -q -m "not ffmpeg" --durations="$SLOW_TEST_COUNT"

  deploy:
    needs: pytest
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && !github.event.deleted &&
          ((github.ref == 'refs/heads/main' && needs.pytest.result == 'success') ||
           startsWith(github.ref, 'refs/tags/deploy-now/')) }}
    runs-on: ubuntu-latest
    environment: Prod
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Skip commits superseded on main
        id: candidate
        run: |
          git fetch origin main
          if test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping deployment: main has advanced beyond this commit."
          fi

      - name: Set up uv
        if: steps.candidate.outputs.current == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Install verification dependencies
        if: steps.candidate.outputs.current == 'true'
        run: uv sync --locked --no-dev

      - name: Deploy main unless already live, then verify
        if: steps.candidate.outputs.current == 'true'
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          uv run --locked --no-dev python -m scripts.deploy "$(git rev-parse HEAD)"
