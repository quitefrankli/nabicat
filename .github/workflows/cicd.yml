name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-server

      - name: Run tests
        run: uv run --locked pytest -q -m "not ffmpeg"

  deploy:
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Prod
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Skip commits superseded on main
        id: candidate
        run: |
          git fetch origin main
          if test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping deployment: main has advanced beyond this commit."
          fi

      - name: Set up uv
        if: steps.candidate.outputs.current == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Install verification dependencies
        if: steps.candidate.outputs.current == 'true'
        run: uv sync --locked --no-dev

      - name: Deploy main
        if: steps.candidate.outputs.current == 'true'
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          python -c 'import json, os; print(json.dumps({
            "username": os.environ["ADMIN_USER"],
            "password": os.environ["ADMIN_PASS"],
          }))' |
            curl --fail --show-error --silent \
              --header "Content-Type: application/json" \
              --data-binary @- \
              https://nabicat.site/api/update

      - name: Verify public deployment commit
        if: steps.candidate.outputs.current == 'true'
        run: uv run --locked --no-dev python -m scripts.verify_deployment "$GITHUB_SHA"
